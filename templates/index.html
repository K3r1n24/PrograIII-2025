<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - FLIA UGB</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2.3">
</head>
<body class="login-page">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card login-card p-4 shadow-lg border-0" style="max-width: 400px; width: 100%;">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='logo_ugb.png') }}"
                     alt="Logo UGB" 
                     class="logo-img mb-3">
                <h1 class="card-title h4 mt-3 text-primary">FLIA UGB</h1>
                <p class="text-muted small">Feria de Logros - Iniciar Sesión</p>
            </div>

            <!-- MENSAJES FLASH -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else ('success' if category == 'success' else 'info') }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Pestañas (Participante / Juez/Admin) -->
            <ul class="nav nav-pills nav-fill mb-3" id="loginTabs" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" id="participante-tab" data-bs-toggle="tab" data-bs-target="#participante" type="button" role="tab">Participante</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="admin-juez-tab" data-bs-toggle="tab" data-bs-target="#admin-juez" type="button" role="tab">Juez/Admin</button>
                </li>
            </ul>

            <div class="tab-content" id="loginTabsContent">
                <!-- LOGIN PARTICIPANTE -->
                <div class="tab-pane fade show active" id="participante" role="tabpanel" aria-labelledby="participante-tab">
                    <form method="POST" action="{{ url_for('index') }}">
                        <input type="hidden" name="form_type" value="participante">
                        
                        <div class="mb-3">
                            <input type="text" name="cuenta_universidad" class="form-control login-input" placeholder=" correo institucional" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" name="password" class="form-control login-input" placeholder="Contraseña" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                    </form>

                    <p class="text-center text-muted mt-3 small">
                        ¿No tienes cuenta? <a href="{{ url_for('registro') }}" class="text-primary">Regístrate aquí</a>
                    </p>
                </div>

                <!-- LOGIN JUEZ/ADMIN -->
                <div class="tab-pane fade" id="admin-juez" role="tabpanel" aria-labelledby="admin-juez-tab">
                    <form method="POST" action="{{ url_for('index') }}">
                        <input type="hidden" name="form_type" value="juez_admin">
                        
                        <div class="mb-3">
                            <input type="email" name="cuenta_universidad" class="form-control login-input" placeholder="Correo institucional" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" name="password" class="form-control login-input" placeholder="Contraseña" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
