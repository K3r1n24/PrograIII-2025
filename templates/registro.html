<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Participante - FLIA UGB</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2.3">
</head>
<body class="login-page">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card login-card p-4 shadow-lg border-0" style="max-width: 500px; width: 100%;">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='logo_ugb.png') }}"
                     alt="Logo UGB" 
                     class="logo-img mb-3">
                <h1 class="card-title h4 mt-3 text-primary">Registro de Participante</h1>
                <p class="text-muted small">Crea tu cuenta de acceso a la Feria de Logros</p>
            </div>

            <!-- MENSAJES FLASH -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else ('success' if category == 'success' else 'info') }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- FORMULARIO DE REGISTRO -->
            <form method="POST" action="{{ url_for('registro') }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="text" name="nombre" class="form-control login-input" placeholder="Nombre" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <input type="text" name="apellido" class="form-control login-input" placeholder="Apellido" required>
                    </div>
                </div>

                <div class="mb-3">
                    <input type="text" name="cuenta_universidad" class="form-control login-input" placeholder="Carnet o Correo UGB (ej: aa1234123)" required>
                </div>

                <div class="mb-3">
                    <input type="password" name="password" class="form-control login-input" placeholder="Contraseña (Mín. 6 caracteres)" required>
                </div>

                <div class="mb-3">
                    <select name="ciclo" class="form-select login-input" required>
                        <option value="">Selecciona tu Ciclo</option>
                        <option value="1-2025">Ciclo I-2025</option>
                        <option value="2-2025">Ciclo II-2025</option>
                        <option value="3-2025">Ciclo III-2025</option>
                        <option value="4-2025">Ciclo IV-2025</option>
                        <option value="5-2025">Ciclo V-2025</option>
                        <option value="6-2025">Ciclo VI-2025</option>
                        <option value="7-2025">Ciclo VII-2025</option>
                        <option value="8-2025">Ciclo VIII-2025</option>
                        <option value="9-2025">Ciclo IX-2025</option>
                        <option value="10-2025">Ciclo X-2025</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">REGISTRARME</button>

                <p class="text-center text-muted small">
                    ¿Ya tienes cuenta? <a href="{{ url_for('index') }}" class="text-primary">Inicia sesión aquí</a>
                </p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
